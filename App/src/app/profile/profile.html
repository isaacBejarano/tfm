@let profile = store().userProfile;

<h1 class="mb-4 text-2xl text-blue-500 text-center">Perfil de Usuario</h1>

@if (profile) {
  <div class="pl-4 p-2 mb-4 list-decimal border border-blue-500/50 rounded-xl">
    <!-- FIXME: Admin y Super -->
    @if (true) {
      <app-btn
        ($click)="back()"
        ariaLabel="Botón para volver a la lista de usuarios"
        [css]="btnGraySlim"
      >
        <svg class="size-5 fill-current" viewBox="0 0 100 100">
          <use xlink:href="svg/icon-sprite.xml#icon-arrow-back" />
        </svg>
      </app-btn>
    }

    <h2 class="mb-2 text-xl text-blue-500">Detalles</h2>

    <ul>
      <li>
        <span class="text-blue-500 mr-1"> Nombre: </span>
        <span> {{ profile.name }} </span>
      </li>
      <li>
        <span class="text-blue-500 mr-1"> Correo Electrónico: </span>
        <span> {{ profile.email }} </span>
      </li>
    </ul>
    <!-- Actions -->
    <div class="mb-2 mt-4 flex gap-4">
      <app-btn
        ($click)="action('patch', profile.id)"
        [ariaLabel]="`Botón para editar al usuario '${profile.name}'`"
        [css]="btnGraySlim"
      >
        <svg class="size-5 fill-current" viewBox="0 0 100 100">
          <use xlink:href="svg/icon-sprite.xml#icon-edit" />
        </svg>
      </app-btn>
      <app-btn
        ($click)="action('delete', profile.id)"
        [ariaLabel]="`Botón para eliminar la cuenta del usuario '${profile.name}'`"
        [css]="btnRedSlim"
      >
        <svg class="size-5 fill-current" viewBox="0 0 100 100">
          <use xlink:href="svg/icon-sprite.xml#icon-trash" />
        </svg>
      </app-btn>
    </div>
  </div>

  @if (formPatch()) {
    <div class="p-2 md:p-4 list-decimal border border-rose-500/50 rounded-xl">
      <h2 class="mb-2 text-xl text-rose-500 text-center">Editar Perfil</h2>
      <app-profile-form class="mt-8" ($userPayload)="onPatch($event)" />
    </div>
  }
} @else {
  <p class="text-red-500">No hay usuario visible.</p>
}
