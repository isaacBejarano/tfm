@let formAuth = store().formAuth;

@if (formAuth === 'signup') {
  <h1 class="text-2xl text-blue-500 text-center">Registro</h1>
  <app-form-auth class="mt-8" ($userPayload)="signup($event)" />
} @else if (formAuth === 'login') {
  <h1 class="text-2xl text-rose-500 text-center">Acceso</h1>
  <app-form-auth class="mt-8" ($userPayload)="login($event)" [excludeFields]="['name']" />
} @else {
  <div class="relative">
    <h1
      class="mb-4 2xl:mb-6 2xl:max-w-[740px] 2xl:mx-auto bg-linear-to-r from-lime-500 to-rose-500 bg-clip-text text-center text-3xl md:text-5xl 2md:text-9xl text-transparent font-black animate-[fade-in_1s_ease-in_1.5s_normal_backwards]"
    >
      Tu planificador hortícola
    </h1>
  </div>

  <div
    class="w-full h-[300px] bg-cover bg-center md:h-[430px] md:bg-cover 2xl:w-[900px] 2xl:mx-auto bg-[url(/img/bhut-jolokia.jpg)] bg-no-repeat rounded-xl inset-shadow-sm inset-shadow-mist-950 animate-[fade-in_1s_ease-in_2.5s_normal_backwards]"
  ></div>
}
