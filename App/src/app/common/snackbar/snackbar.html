<div
  class="max-w-sm 2xl:max-w-md mt-20 md:mt-22 p-4 z-5 border border-amber-300/25 bg-mist-800 rounded-xl animate-[fade-in_0.25s_ease-in_0s_1_normal_backwards]"
>
  <svg
    class="block mx-auto fill-current size-10"
    viewBox="0 0 100 100"
    [class.text-lime-500]="icon() === 'icon-check'"
    [class.text-rose-500]="icon() === 'icon-warning'"
  >
    <use [attr.xlink:href]="[`./svg/icon-sprite.xml#${icon()}`]" />
  </svg>

  <p class="text-amber-200/75">
    {{ msg() }}
  </p>
</div>
