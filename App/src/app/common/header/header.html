<div
  class="w-full sticky top-0 bg-linear-to-b from-mist-950 from-90% to-mist-950/50 border border-mist-900/75"
>
  <!-- PRIVATE -->
  @if (isLogged()) {
    <div class="max-w-(--w-desktop) mx-auto p-2">
      <!-- BRAND -->
      <header class="flex md:gap-8">
        <!-- icon -->
        <div
          class="size-[35px] self-center bg-[url(/img/favicon.webp)] bg-no-repeat bg-contain animate-fade-in"
        ></div>

        <!-- TOP MENU PRIVATE -->
        <nav
          class="ml-4 p-2 flex justify-center gap-8 text-[min(10dvw,12px)] 2xl:text-[min(10dvw,1rem)]"
        >
          <!-- TODO: 'Admin' and 'Super' roles are only for maintenance, they have no agenda. To have one: log in as 'User'  -->
          <!-- TODO: INE selector @ agenda -->
          @if (role() === 'User') {
            <app-btn [route]="navTo('agendas/:id')" label="Agenda" [css]="btnGreen" />
          }
          @if (role() !== 'User') {
            <app-btn [route]="navTo('users')" label="Usuarios" [css]="btnBlue" />
          }

          <app-btn label="Perfil" [css]="btnBlue" />
          <app-btn label="Salir" [css]="btnRose" ($click)="logout()" />
        </nav>
      </header>

      <!-- TOP MENU -->
    </div>
  }
  <!-- PUBLIC -->
  @else {
    <div class="max-w-(--w-desktop) mx-auto p-2">
      <!-- BRAND -->
      <header class="flex md:gap-8 justify-between">
        <!-- icon -->
        <div
          class="size-[45px] md:size-[50px] 2xl:size-[70px] self-center bg-[url(/img/favicon.webp)] bg-no-repeat bg-contain inset-shadow-sm inset-shadow-black animate-fade-in"
        ></div>

        <!-- logo -->
        <div
          class="w-[205px] h-[50px] 2xl:w-[270px] 2xl:h-[80px] bg-[url(/img/logo-clip.webp)] bg-clip-text bg-top text-5xl 2xl:text-7xl text-transparent font-black animate-[fade-in_1s_ease-in_1.5s_normal_backwards]"
        >
          {{ legend() }}
        </div>

        <!-- wildcard slot -->
        <div class="w-[50px] h-[50px]"></div>
      </header>

      <!-- TOP MENU PUBLIC -->
      <nav class="mt-1 p-3 2xl:p-2 flex justify-center gap-8">
        <app-btn
          [route]="navTo('')"
          label="Acceso"
          [css]="btnRose"
          ($click)="toggleAuthForms('login')"
        />
        <app-btn
          [route]="navTo('')"
          label="¡Regístrate!"
          [css]="btnBlue"
          ($click)="toggleAuthForms('signup')"
        />
      </nav>
    </div>
  }
</div>
