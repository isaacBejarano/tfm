@let _user = store().userLogged;

<div
  class="w-full sticky top-0 bg-linear-to-b from-mist-950 from-90% to-mist-950/50 border border-mist-900/75"
>
  <!-- PRIVATE -->
  @if (_user !== null) {
    <div class="max-w-(--w-desktop) mx-auto p-2">
      <!-- BRAND -->
      <header class="flex md:gap-8">
        <!-- icon -->
        <div
          class="size-[35px] self-center bg-[url(/img/favicon.webp)] bg-no-repeat bg-contain animate-fade-in cursor-pointer"
          (click)="clearHome()"
        ></div>

        <!-- TOP MENU PRIVATE -->
        <nav
          class="ml-4 p-2 flex justify-center gap-4 2xl:gap-6 text-[min(10dvw,12px)] 2xl:text-[min(10dvw,1rem)]"
        >
          <!-- TODO: INE selector @ agenda -->
          @if (_user.roles.includes('User')) {
            <app-btn
              [route]="routeTo('agendas', 'new')"
              label="Agenda"
              [css]="`${btnGreen} flex gap-0.5 items-center`"
            >
              <svg class="size-5 fill-current" viewBox="0 0 100 100">
                <use xlink:href="svg/icon-sprite.xml#icon-agenda" />
              </svg>
            </app-btn>
          } @else {
            <app-btn
              [route]="routeTo('users')"
              label="Usuarios"
              [css]="`${btnBlue} flex gap-0.5 items-center`"
            >
              <svg class="size-5 fill-current" viewBox="0 0 100 100">
                <use xlink:href="svg/icon-sprite.xml#icon-user-list" />
              </svg>
            </app-btn>
          }
          <app-btn
            [route]="routeTo('users', _user.id)"
            label="Perfil"
            [css]="`${btnBlue} flex gap-0.5 items-center`"
          >
            <svg class="size-5 fill-current" viewBox="0 0 100 100">
              <use xlink:href="svg/icon-sprite.xml#icon-profile" />
            </svg>
          </app-btn>
          <app-btn label="Salir" [css]="`${btnRose} flex gap-0.5 items-center`" ($click)="logout()">
            <svg class="size-5 fill-current" viewBox="0 0 100 100">
              <use xlink:href="svg/icon-sprite.xml#icon-logout" />
            </svg>
          </app-btn>
        </nav>
      </header>

      <!-- TOP MENU -->
    </div>
  }
  <!-- PUBLIC -->
  @else {
    <div class="max-w-(--w-desktop) mx-auto p-2">
      <!-- BRAND -->
      <header class="flex md:gap-8 justify-between 2xl:justify-center">
        <!-- icon -->
        <div
          class="size-[45px] 2xl:size-[50px] self-center bg-[url(/img/favicon.webp)] bg-no-repeat bg-contain animate-fade-in cursor-pointer hover:rotate-5"
          (click)="clearHome()"
        ></div>

        <!-- logo -->
        <div
          class="w-[205px] h-[50px] 2xl:w-[270px] 2xl:h-[80px] bg-[url(/img/logo-clip.webp)] bg-clip-text bg-top text-center text-5xl 2xl:text-7xl text-transparent font-black animate-[fade-in_1s_ease-in_1.5s_normal_backwards]"
        >
          {{ legend() }}
        </div>

        <!-- wildcard slot -->
        <div class="w-[50px] h-[50px]"></div>
      </header>

      <!-- TOP MENU PUBLIC -->
      <nav class="mt-1 p-3 2xl:p-2 flex justify-center gap-4 2xl:gap-6">
        <app-btn
          [route]="routeTo('')"
          label="Acceso"
          [css]="`${btnRose} flex gap-0.5 items-center`"
          ($click)="toggleAuthForms('login')"
        >
          <svg class="size-5 fill-current" viewBox="0 0 100 100">
            <use xlink:href="svg/icon-sprite.xml#icon-login" />
          </svg>
        </app-btn>

        <app-btn
          [route]="routeTo('')"
          label="¡Regístrate!"
          [css]="btnBlue"
          ($click)="toggleAuthForms('signup')"
        />
      </nav>
    </div>
  }
</div>
