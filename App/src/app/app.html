<div

>
  <!-- TODO: menu -->
  <div class="max-w-(--w-desktop) mx-auto p-2">
    <!-- brand -->
    <header class="flex md:gap-8 justify-between">
      <!-- icon -->
      <div
        class="w-[50px] h-[50px] self-center bg-[url(/favicon.webp)] bg-no-repeat inset-shadow-sm inset-shadow-black animate-fade-in"
      ></div>

      <!-- logo -->
      <!-- <div class="w-[205px] h-[50px] bg-[url(/img/logo.webp)] bg-no-repeat"></div> -->
      <h1
        class="w-[205px] h-[50px] 2xl:w-[270px] 2xl:h-[80px] bg-[url(/img/logo-clip.webp)] bg-clip-text bg-top text-5xl 2xl:text-7xl text-transparent font-black animate-[fade-in_1s_ease-in_1.5s_normal_backwards]"
      >
        Kübello
      </h1>

      <!-- banner -->
      <div
        class="w-[50px] h-[50px] self-center invisible md:visible bg-[url(/img/banner.webp)] bg-no-repeat bg-right inset-shadow-sm inset-shadow-black animate-[fade-in_1s_ease-in_2s_normal_backwards]"
      ></div>
    </header>

    <!-- menu -->
    <nav class="mt-3 p-3 2xl:p-2 flex justify-center gap-8">
      <app-btn route="" label="Acceso" color="rose" />
      <app-btn route="" label="¡Regístrate!" color="blue" />
    </nav>
  </div>
</div>

>
  <router-outlet />
</main>

<!-- Mandatory ROW 3 - index.html:grid-row-auto -->
<footer class="bg-mist-950/50 border border-mist-900/75">
  <nav
    class="max-w-(--w-desktop) mx-auto p-3 2xl:p-2 flex flex-wrap justify-center gap-8 text-[min(10dvw,12px)] 2xl:text-[min(10dvw,1rem)]"

    <app-btn route="cookies" label="Política de Cookies" />
