<h1 class="mt-4 mb-6 2xl:mb-10 text-2xl text-blue-500 text-center">Usuarios</h1>

<!-- TODO: CDK virtual scroll -->
<ol class="p-2">
  @for (user of users(); track user.id; let idx = $index) {
    <li
      class="mb-2 p-2 border border-blue-500/25 rounded-xl cursor-pointer hover:bg-blue-700/5 active:bg-blue-500/8"
      (click)="profile(user.id)"
    >
      <ul class="ml-2">
        <li class="flex justify-between">
          <div class="flex flex-col">
            <span>
              <span class="text-blue-500"> Nombre: </span>
              {{ user.name ?? 'Anónimo' }}
            </span>
            <span>
              <span class="text-blue-500"> Correo Electrónico: </span>
              {{ user.email }}
            </span>
          </div>
          <div class="flex flex-col">
            <span>
              <span class="text-mauve-400"> Roles: </span>
              {{ user.roles }}
            </span>
            <span>
              <span class="text-mauve-400"> Orden </span>
              {{ idx + 1 }}
            </span>
          </div>
        </li>
      </ul>
    </li>
  } @empty {
    <li class="text-red-500">No hay usuarios visibles.</li>
  }
</ol>
