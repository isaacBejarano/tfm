name: Monorepo CI/CD

on:
  push:
    branches:
      - master

jobs:
  # JOB 1 - API Test -> https://docs.github.com/es/actions/tutorials/build-and-test-code/net
  cicd-dotnet-test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Api
    steps:
      - uses: actions/checkout@v5
      - name: .NET Build
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.112"
          cache: true
          cache-dependency-path: "Api/**/*.csproj"
      - run: dotnet restore src/Api.csproj # not required but good for faster builds by using cached deps
      - run: dotnet restore tests/Api.Tests.csproj # not required but good for faster builds by using cached deps
      - run: dotnet build src/Api.csproj --no-restore --configuration Release
      - run: dotnet build tests/Api.Tests.csproj --no-restore --configuration Release
      - run: dotnet test --project=tests/Api.Tests.csproj --no-build --configuration Release
  # JOB 2 - API Deploy (OCI to VPS) -> https://github.com/appleboy/scp-action/tree/master/ & https://github.com/appleboy/ssh-action/tree/v1/
  cicd-dotnet-deploy:
    runs-on: ubuntu-22.04
    needs: cicd-dotnet-test
    defaults:
      run:
        working-directory: Api/src
    steps:
      - uses: actions/checkout@v5
      - name: .NET Publish
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.112"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restoring dependencies...
        run: dotnet restore Api.csproj --runtime linux-x64 # not required but good for faster builds by using cached deps
      - name: Compiling...
        run: dotnet publish Api.csproj --output ./publish --no-restore --configuration Release --runtime linux-x64 --self-contained true # runtime is VPS's uname
      - name: 1. Stop Kübello API service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo systemctl stop ${{ secrets.VPS_SYSTEMCTL_API }}
      - name: 2. Stop DB container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ secrets.VPS_PATH_DB_COMPOSE }}
            sudo docker compose down
      - name: 3. Remove API old files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo rm -rf ${{ secrets.VPS_PATH_API }} # Don't remove config files
      - name: 4. Copy API compiled files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "Api/src/publish/*" # 'appleboy' needs explicit path from root to "publish/"
          target: ${{ secrets.VPS_PATH_API }} # reading permission required!
          strip_components: 3
      - name: 5. Copy API & DB setting files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            sudo cp ${{ secrets.VPS_APP_SETTINGS }} ${{ secrets.VPS_PATH_API }}
            sudo cp ${{ secrets.VPS_APP_SETTINGS_PROD }} ${{ secrets.VPS_PATH_API }}
      - name: 6. Add permissions to OS user
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd ${{ secrets.VPS_PATH_DB_COMPOSE }}
            sudo chown -R ubuntu:ubuntu ${{ secrets.VPS_PATH_DB_COMPOSE }}
            cd ${{ secrets.VPS_PATH_API }}
            sudo chown -R ubuntu:ubuntu ${{ secrets.VPS_PATH_API }}
      - name: 7. Restart DB container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd ${{ secrets.VPS_PATH_DB_COMPOSE }}
            sudo docker compose up --detach
      - name: 8. Restart Kübello service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo systemctl restart ${{ secrets.VPS_SYSTEMCTL_API }}
      - name: 9. Restart Caddy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: sudo systemctl reload caddy
  # JOB 3 - App Test (OCI will deploy via Netlify)
  cicd-angular:
    runs-on: ubuntu-22.04
    needs: cicd-dotnet-deploy
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - name: Angular Build
        uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: "npm"
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test
