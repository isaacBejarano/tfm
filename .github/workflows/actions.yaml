name: Monorepo CI/CD

on:
  push:
    branches:
      - master

jobs:
  # JOB 1 - API Test -> https://docs.github.com/es/actions/tutorials/build-and-test-code/net
  cicd-dotnet-test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Api
    steps:
      - uses: actions/checkout@v5
      - name: .NET Build
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.112"
          cache: true
          cache-dependency-path: "Api/**/*.csproj"
      - run: dotnet restore src/Api.csproj
      - run: dotnet restore tests/Api.Tests.csproj
      - run: dotnet build src/Api.csproj --no-restore --configuration Release
      - run: dotnet build tests/Api.Tests.csproj --no-restore --configuration Release
      - run: dotnet test --project=tests/Api.Tests.csproj --no-build --configuration Release
  # JOB 2 - API Deploy OCI to VPS -> https://github.com/appleboy/scp-action/tree/master/ & https://github.com/appleboy/ssh-action/tree/v1/
  cicd-dotnet-deploy:
    runs-on: ubuntu-22.04
    needs: cicd-dotnet-test
    defaults:
      run:
        working-directory: Api
    steps:
      - uses: actions/checkout@v5
      - name: .NET Build
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.112"
          cache: true
          cache-dependency-path: "Api/**/*.csproj"
      - name: .NET Publish
        run: dotnet publish --configuration Release -o ./publish
      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./publish/*"
          target: "/var/www/html" # reading permission!
          # TODO: remove old publish before copying new compilation
      - name: Restart Caddy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            caddy validate --config Caddyfile
            sudo systemctl reload caddy
  # JOB 3 - App Test (OCI will deploy via Netlify)
  cicd-angular:
    runs-on: ubuntu-22.04
    needs: cicd-dotnet-deploy
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - name: Angular Build
        uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: "npm"
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test

