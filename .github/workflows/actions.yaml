name: Monorepo CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # job 1 - API / https://docs.github.com/es/actions/tutorials/build-and-test-code/net
  cicd-dotnet:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Api
    steps:
      - uses: actions/checkout@v5
      - name: .NET Build
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.112"
          cache: true
          cache-dependency-path: "Api/**/*.csproj"
      - run: dotnet restore src/Api.csproj
      - run: dotnet restore tests/Api.Tests.csproj
      - run: dotnet build src/Api.csproj --no-restore --configuration Release
      - run: dotnet build tests/Api.Tests.csproj --no-restore --configuration Release
      - run: dotnet test --project=tests/Api.Tests.csproj --no-build --configuration Release
  # job 2 - App
  cicd-angular:
    runs-on: ubuntu-22.04
    needs: cicd-dotnet
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - name: Angular Build
        uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: "npm"
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run test
  # job 3 - OCI of API
  docker:
    runs-on: ubuntu-latest
    needs: cicd-dotnet
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
