# Infrastructure as Code (IaC) #
################################

services:
  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres
    restart: always
    ports:
      - ${DB_CONTAINER_PORTS}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PW} # masterpassword for Server superuser 'postgres'
    volumes:
      - ${POSTGRES_VOLUMES}

volumes:
  data-postgres:
    driver: default

